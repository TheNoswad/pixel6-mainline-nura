# Local (oriole): the gs101 MIPI-CSIS capture nodes deliver raw Bayer
# straight from the sensors; only libcamera (simple pipeline + software
# ISP) turns that into a picture. Don't offer them to apps as V4L2 cameras
# next to the libcamera ones.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.platform-*.mipi-csis" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
