# Local (oriole): restoring the saved AoC/cs35l41 mixer state at boot wedged
# AoC (command timeouts, then every AoC command failed with -ENODEV) and
# could re-enable the amps before the protection firmware is set up.
# oriole-speaker-setup.service sets the mixer instead. Opt back in with
# oriole.alsa_restore on the kernel command line.
[Unit]
ConditionKernelCommandLine=oriole.alsa_restore
