# Local: deep suspend never resumes on gs101 with the 7.2 kernel
# (PM: suspend entry (deep) is the last thing logged), but s2idle works
# with kernel r5 (exynos-pmu C2 hint fix). The kernel default is deep, so
# suspend must ask for s2idle. No hibernation (no swap/resume set up).
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
