# Local: bcmdhd registers Android-only extra interfaces. wlan1 is a
# WL_STATIC_IF placeholder; when NetworkManager manages it, the MAC
# randomisation makes bcmdhd delete and re-add firmware ifidx 1, and
# wpa_supplicant's PMKSA flush on it then oopses in dhd_net2idx while
# holding rtnl (all networking hangs). Keep NM off all three.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:aware_nmi0;interface-name:radiotap0
