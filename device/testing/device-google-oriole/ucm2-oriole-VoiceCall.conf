# Voice call: the modem's downlink and uplink are routed inside the AoC.
# The voice endpoints (EP5 playback, device 4; EP4 capture, device 11) are
# hostless and must be prepared and started for the call path to open;
# aoc-voiced does that while ModemManager has a call. Media and ringtones
# keep using EP6 (device 5).
#
# Values follow the stock audio HAL's voice-call, voice-handset and
# voice-handset-mic paths (mixer_paths.xml). Earpiece and speaker each mute
# the other amp's input instead of switching amps on and off, so the
# protection setup done at boot is never touched. Both are ports of the
# same sink (no ConflictingDevice: that would split them into two profiles
# and callaudiod's speaker toggle switches ports, not profiles); the sound
# server enables only the active port's device.

SectionVerb {
	EnableSequence [
		cset "name='AoC Modem Downlink ASRC Mode' ASP_ON"
		cset "name='Voice Call Mic Source' Builtin_MIC"
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,1,2,-1"
		cset "name='MIC DC Blocker' on"
		cset "name='MIC HW Gain At High Power Mode (cB)' 130"
		cset "name='Incall Sink Mute' off"
		cset "name='Incall Mic Mute' off"
		cset "name='Voice Call Mic Mute' off"
		cset "name='Voice Call Audio Enable' on"
		cset "name='TDM_0_RX Mixer EP5' on"
		cset "name='EP4 TX Mixer INTERNAL_MIC_TX' on"
	]

	DisableSequence [
		cset "name='EP4 TX Mixer INTERNAL_MIC_TX' off"
		cset "name='TDM_0_RX Mixer EP5' off"
		cset "name='MIC HW Gain At High Power Mode (cB)' 0"
		cset "name='BUILDIN MIC ID CAPTURE LIST' -1,-1,-1,-1"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='R DSP RX1 Source' Zero"
		cset "name='R DSP RX2 Source' Zero"
	]

	DisableSequence [
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	# The call downlink is mono in TDM slot 0; the bottom amp's ASPRX1
	# reads slot 1 (the right channel of media), so feed its DSP from
	# ASPRX2 (slot 0), and allow it the stock voice-speaker boost current
	# (media uses 1.90A, set at boot by oriole-speaker-setup).
	EnableSequence [
		cset "name='DSP RX1 Source' Zero"
		cset "name='DSP RX2 Source' Zero"
		cset "name='R DSP RX2 Source' ASPRX2"
		cset "name='R Boost Peak Current Limit' 3.50A"
	]

	DisableSequence [
		cset "name='R Boost Peak Current Limit' 1.90A"
		cset "name='R DSP RX2 Source' ASPRX1"
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 2
	}
}
