# Local (oriole): echo cancellation for the built-in speaker + mic.
# Nothing else cancels echo outside real calls (the AoC does that for modem
# calls only, and Android's AcousticEchoCanceler is a no-op in Waydroid), so
# VoIP apps send the speaker straight back to the far end.
#
# WirePlumber smart filters: every stream linked to the HiFi speaker or
# mic goes through the canceller, whatever default the user has saved (a
# saved default beats priority.session, so ranking the filter nodes above
# the raw ones is not enough). Bluetooth headsets are not affected. In the
# Voice Call profile the HiFi nodes are gone and the filter sits idle.
# One link group per direction: WirePlumber pairs each smart filter with the
# first stream in its link group, and the module puts all four nodes in one.
# Gain control stays off: the UCM mic gain is the level we want.
context.modules = [
  {
    name = libpipewire-module-echo-cancel
    # never take all of PipeWire down with it
    flags = [ ifexists nofail ]
    args = {
      library.name = aec/libspa-aec-webrtc
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = false
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
      }
      capture.props = {
        node.name = "oriole_ec.capture"
        node.link-group = "oriole-ec-in"
      }
      source.props = {
        node.name = "oriole_ec.source"
        node.link-group = "oriole-ec-in"
        node.description = "Internal Microphone (echo cancelled)"
        filter.smart = true
        filter.smart.name = "oriole-ec-source"
        filter.smart.target = { node.name = "alsa_input.platform-sound-aoc.HiFi__Mic__source" }
      }
      sink.props = {
        node.name = "oriole_ec.sink"
        node.link-group = "oriole-ec-out"
        node.description = "Speaker (echo cancelled)"
        filter.smart = true
        filter.smart.name = "oriole-ec-sink"
        filter.smart.target = { node.name = "alsa_output.platform-sound-aoc.HiFi__Speaker__sink" }
      }
      playback.props = {
        node.name = "oriole_ec.playback"
        node.link-group = "oriole-ec-out"
      }
    }
  }
]
