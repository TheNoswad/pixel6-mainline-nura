# Local: don't boost RT tasks to max frequency (Android's setting). With the
# kernel default (1024) schedutil maxes a cluster whenever an RT task runs:
# PipeWire's data loop and the panfrost/ufs IRQ threads kept the X1 at
# 2.7 GHz 44% of the time with only music playing; with 0 it is ~0%.
# "-": kernels without UCLAMP_TASK (r19 and older) don't have the key.
-kernel.sched_util_clamp_min_rt_default = 0
