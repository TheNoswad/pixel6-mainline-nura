# Media playback: the deep-buffer endpoint EP6 (device 5) to both amps.
#
# The amps' calibration, protection firmware and enable switches are set up
# once at boot by oriole-speaker-setup (it reads the factory calibration);
# this config only selects each amp's input. The top amp drives the
# earpiece, the bottom one the loudspeaker; for media both play.

SectionVerb {
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"
		# The record endpoint's front end only opens while it is routed.
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' on"
	]

	DisableSequence [
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 2
	}
}

# Recording: the AoC record endpoint EP1 (device 8, routed by the verb)
# fed by the built-in mics, as the stock HAL's audio-record + handset-mic paths do.
SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='Mic Spatial Module Enable' on"
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,1,2,-1"
		cset "name='MIC DC Blocker' on"
		cset "name='MIC Record Soft Gain (dB)' 22"
	]

	DisableSequence [
		cset "name='MIC Record Soft Gain (dB)' 0"
		cset "name='BUILDIN MIC ID CAPTURE LIST' -1,-1,-1,-1"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}
