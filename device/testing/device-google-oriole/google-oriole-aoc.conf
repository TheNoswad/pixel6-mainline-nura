; Local (oriole): AoC sound card. EP6 (hw:0,5) is the deep-buffer speaker
; endpoint; the aoc driver pins its ring geometry (960 frames x 4). The
; oriole-speaker path ignores every mixer element: software volume only.
[General]
auto-profiles = no

[Mapping speaker]
description = Speaker
device-strings = hw:%f,5
channel-map = left,right
direction = output
paths-output = oriole-speaker
priority = 100

[Profile output:speaker]
description = Speaker
output-mappings = speaker
priority = 100
skip-probe = yes
