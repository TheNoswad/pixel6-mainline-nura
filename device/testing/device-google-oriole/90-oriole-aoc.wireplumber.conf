# Local (oriole): the AoC speaker endpoint (EP6, hw:0,5).
# - mmap off: with mmap the endpoint plays loud garbage.
# - timer scheduling on: after a late refill the aoc driver stops sending
#   period interrupts (AoC stops consuming) and never reports an xrun, so
#   with period wakeups PipeWire waits forever and the whole graph goes
#   silent. Timer wakeups read the pointer and recover.
# - the ring geometry the aoc driver pins (960 frames x 4).
# PipeWire does not rewind, which this driver cannot handle (PulseAudio's
# rewinds replay or drop chunks: choppy audio, stutter on volume changes).
#
# The AoC card's compress-offload device is disabled: nothing here uses
# offload, and since the card has a UCM config PipeWire would expose it as a
# second card with the same HiFi/Voice Call profiles, which callaudiod then
# picks instead of the real one (no speaker toggle during calls).
monitor.alsa.rules = [
  {
    matches = [
      { device.api = "alsa:compressed", device.bus-path = "platform-sound-aoc" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound-aoc.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
        api.alsa.disable-tsched = false
        api.alsa.period-size = 960
        api.alsa.period-num = 4
        api.alsa.headroom = 0
      }
    }
  }
]
