# Local (oriole): Flatpak apps use org.freedesktop.Platform.GL.oriole (Mesa
# with the gs101 Mali-G78 patch) instead of GL.default, which only has
# llvmpipe here. Not "oriole:default": flatpak then mounts default first and
# it wins. Needs a GL.oriole build for every runtime branch in use
# (~/flatpak-gl on the phone); apps on a branch without one get no GL.
FLATPAK_GL_DRIVERS=oriole
