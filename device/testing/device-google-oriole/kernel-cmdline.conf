clk_ignore_unused
regulator_ignore_unused
# The stock bootloader adds these; U-Boot/systemd-boot boots need them too
id_aa64mmfr1.vh=0
kvm-arm.mode=nvhe
# The stock bootloader passes console=null. Under U-Boot/systemd-boot the
# DT stdout-path (serial@10a00000) becomes a printk console instead, and
# writes to it stall the CPUs: I2C timeouts (gauge reads 0 %), hard freezes
console=tty0
# U-Boot's EFI ResetSystem is a stub; with runtime services on, reboots
# hung after the journal stopped. The RTC is the PMIC's, nothing is lost
efi=noruntime
