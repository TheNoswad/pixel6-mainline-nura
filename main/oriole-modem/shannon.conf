# Samsung Shannon (Pixel 6) ModemManager plugin settings, see
# mm-broadband-modem-shannon.c in the modemmanager package.
# Not carrier specific: the plugin picks the CP's carrier config from the SIM
# with the confpack's cfg.db, and the attach APN defaults to the network's.
# To force one: [carrier] manifest=<confmap.confman> and/or [attach] apn=.
[attach]
ip-type=ipv4v6

[carrier]
# confpack as the CP sees it (over RFS) and as the AP sees it
path=/mnt/vendor/modem_img/images/default/confpack
db=/run/oriole/modem/images/default/confpack/cfg.db

[ims]
# VoLTE, see mm-shannon-ims.c
enabled=true

# Per-carrier settings, by the confpack entry picked from the SIM
# (confnames in cfg.db). Verizon's carrier config only attaches once the
# APN table holds its own class 1 (IMS) APN.
[carrier:us_vzw]
ims-apn=VZWIMS
