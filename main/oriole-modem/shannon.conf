# Samsung Shannon (Pixel 6) ModemManager plugin settings, see
# mm-broadband-modem-shannon.c in the modemmanager package.
# CARRIER SPECIFIC: these values are for T-Mobile US and its MVNOs (tested
# with Mint Mobile). Other carriers need their attach APN and the confpack
# manifest of their carrier entry.
[attach]
apn=Wholesale
ip-type=ipv4v6

[carrier]
# confpack/cfg.db: confmap.confman for carrier_id 1 (us_tmo)
manifest=db470c946a53cf78394db0c730e37a7d49d1ce23
path=/mnt/vendor/modem_img/images/default/confpack

[ims]
# VoLTE (the only voice service on T-Mobile), see mm-shannon-ims.c
enabled=true
